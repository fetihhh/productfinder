name: Günlük toplama ve doğrulama

on:
  schedule:
    - cron: "0 5 * * *" # her gün 05:00 UTC = 08:00 Türkiye
  workflow_dispatch: # Actions sekmesinden elle çalıştırma
    inputs:
      mode:
        description: "Çalıştırma türü"
        type: choice
        default: full
        options:
          - full # tam günlük iş
          - ads # yalnızca reklam analizi (~5 dk)
          - instagram # Instagram hesaplarını bul + çok tutan gönderiler (~5 dk)
          - kesif # Meta Reklam Kütüphanesi'nden yeni reklamcı mağazalar (~10 dk)
          - detay # ürün ayrıntıları ve marka künyesi (~10 dk)
          - verify # toplama hariç hepsi
          - resupply # toptancı aramasını hemen yenile

permissions:
  contents: read

concurrency:
  group: ingest
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run ingest -- $INGEST_MODE
        env:
          # Zamanlanmış çalıştırmada boş (tam iş); elle çalıştırmada seçilen tür (seçenek listesiyle sınırlı).
          INGEST_MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.mode != 'full' && inputs.mode || '' }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          # Gizli ayar yanlışlıkla "META_ACCES_TOKEN" adıyla kaydedildiyse o da okunur.
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN || secrets.META_ACCES_TOKEN }}
