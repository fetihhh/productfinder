name: Günlük toplama ve doğrulama

on:
  schedule:
    - cron: "0 5 * * *" # her gün 05:00 UTC = 08:00 Türkiye: tam iş
    # Gün içi devam (toplama hariç): bekleyen mağaza kontrolleri, alan adı taraması ve yenilenen kotalar.
    - cron: "0 11 * * *"
    - cron: "0 17 * * *"
    - cron: "0 23 * * *"
  workflow_dispatch: # Actions sekmesinden elle çalıştırma
    inputs:
      mode:
        description: "Çalıştırma türü"
        type: choice
        default: full
        options:
          - full # tam günlük iş
          - ads # yalnızca reklam analizi (~5 dk)
          - instagram # Instagram hesaplarını bul + çok tutan gönderiler (~5 dk)
          - kesif # Meta Reklam Kütüphanesi'nden yeni reklamcı mağazalar (~10 dk)
          - detay # ürün ayrıntıları ve marka künyesi (~10 dk)
          - arama # arama servisleri testi (Tavily, Exa, Firecrawl; 1'er arama)
          - buyut # tek seferlik: arama servisleriyle mağaza keşfi (kotaların ~%30'u) + tam günlük akış
          - verify # toplama hariç hepsi
          - resupply # toptancı aramasını hemen yenile
          - devam # gün içi devam: toplama hariç her şey (bekleyen mağazalar, tarama, kotalar)

permissions:
  contents: read

concurrency:
  group: ingest
  cancel-in-progress: false

jobs:
  ingest:
    # Gün içi devam çalıştırmaları yalnızca depo herkese açıkken (sınırsız ücretsiz dakika); özel depoda 2.000 dk/ay aşılmasın.
    if: github.event_name != 'schedule' || github.event.schedule == '0 5 * * *' || !github.event.repository.private
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      # Depo herkese açık: ayrıntılı kayıt (ürün/mağaza adları) GitHub'da gösterilmez, Supabase'deki job_logs tablosuna yazılır.
      # GitHub kaydında yalnızca adım başlıkları ve sayılar görünür.
      - name: Günlük iş (ayrıntılı kayıt gizli)
        id: ingest
        run: |
          set +e
          npm run --silent ingest -- $INGEST_MODE > ingest.log 2>&1
          code=$?
          echo "code=$code" >> "$GITHUB_OUTPUT"
          node scripts/publicLog.ts ingest.log
          exit 0
        env:
          # Zamanlanmış: 05:00 tam iş, diğer saatler devam. Elle: seçilen tür (seçenek listesiyle sınırlı).
          INGEST_MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.mode != 'full' && inputs.mode || github.event_name == 'schedule' && github.event.schedule != '0 5 * * *' && 'devam' || '' }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          EXA_API_KEY: ${{ secrets.EXA_API_KEY }}
          FIRECRAWL_API_KEY: ${{ secrets.FIRECRAWL_API_KEY }}
          # Gizli ayar yanlışlıkla "META_ACCES_TOKEN" adıyla kaydedildiyse o da okunur.
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN || secrets.META_ACCES_TOKEN }}
      - name: Ayrıntılı kaydı Supabase'e yaz
        if: always()
        run: node scripts/saveLog.ts ingest.log
        env:
          RUN_ID: ${{ github.run_id }}
          INGEST_MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.mode || github.event_name == 'schedule' && github.event.schedule != '0 5 * * *' && 'devam' || 'full' }}
          INGEST_OK: ${{ steps.ingest.outputs.code }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      - name: Sonuç
        run: exit ${{ steps.ingest.outputs.code || 1 }}
