name: Günlük toplama ve doğrulama

on:
  schedule:
    # GitHub zamanlayıcısı saat başlarında (dakika 0) en yoğun: çalıştırmalar saatlerce gecikiyor ya da hiç başlamıyor.
    # Bu yüzden saat başı dışındaki dakikalar kullanılır ve sık çalıştırılır; kaçan biri bir sonrakiyle telafi edilir.
    - cron: "17 5 * * *" # 05:17 UTC = 08:17 Türkiye: tam iş
    # Gün içi devam (toplama hariç), 2 saatte bir: bekleyen mağaza kontrolleri, alan adı taraması, yenilenen kotalar.
    # Bir çalıştırma sürerken gelen tetik sıraya girer (aynı anda tek çalıştırma; bekleyen en fazla bir tane).
    - cron: "47 1,3,7,9,11,13,15,17,19,21,23 * * *"
  workflow_dispatch: # Actions sekmesinden elle çalıştırma
    inputs:
      mode:
        description: "Çalıştırma türü"
        type: choice
        default: full
        options:
          - full # tam günlük iş
          - ads # yalnızca reklam analizi (~5 dk)
          - instagram # Instagram hesaplarını bul + çok tutan gönderiler (~5 dk)
          - kesif # Meta Reklam Kütüphanesi'nden yeni reklamcı mağazalar (~10 dk)
          - detay # ürün ayrıntıları ve marka künyesi (~10 dk)
          - arama # arama servisleri testi (Tavily, Exa, Firecrawl; 1'er arama)
          - buyut # tek seferlik: arama servisleriyle mağaza keşfi (kotaların ~%30'u) + tam günlük akış
          - verify # toplama hariç hepsi
          - resupply # toptancı aramasını hemen yenile
          - devam # gün içi devam: toplama hariç her şey (bekleyen mağazalar, tarama, kotalar)

permissions:
  contents: read
  actions: write # zincir: iş bitince sonraki devam çalıştırmasını başlatır

concurrency:
  group: ingest
  cancel-in-progress: false

jobs:
  ingest:
    # Gün içi devam çalıştırmaları yalnızca depo herkese açıkken (sınırsız ücretsiz dakika); özel depoda 2.000 dk/ay aşılmasın.
    if: github.event_name != 'schedule' || github.event.schedule == '17 5 * * *' || !github.event.repository.private
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - run: echo "START_TS=$(date +%s)" >> "$GITHUB_ENV"
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      # Depo herkese açık: ayrıntılı kayıt (ürün/mağaza adları) GitHub'da gösterilmez, Supabase'deki job_logs tablosuna yazılır.
      # GitHub kaydında yalnızca adım başlıkları ve sayılar görünür.
      - name: Günlük iş (ayrıntılı kayıt gizli)
        id: ingest
        run: |
          set +e
          npm run --silent ingest -- $INGEST_MODE > ingest.log 2>&1
          code=$?
          echo "code=$code" >> "$GITHUB_OUTPUT"
          node scripts/publicLog.ts ingest.log
          exit 0
        env:
          # Zamanlanmış: 05:17 tam iş, diğer saatler devam. Elle: seçilen tür (seçenek listesiyle sınırlı).
          INGEST_MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.mode != 'full' && inputs.mode || github.event_name == 'schedule' && github.event.schedule != '17 5 * * *' && 'devam' || '' }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          EXA_API_KEY: ${{ secrets.EXA_API_KEY }}
          FIRECRAWL_API_KEY: ${{ secrets.FIRECRAWL_API_KEY }}
          # Gizli ayar yanlışlıkla "META_ACCES_TOKEN" adıyla kaydedildiyse o da okunur.
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN || secrets.META_ACCES_TOKEN }}
      - name: Ayrıntılı kaydı Supabase'e yaz
        if: always()
        run: node scripts/saveLog.ts ingest.log
        env:
          RUN_ID: ${{ github.run_id }}
          INGEST_MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.mode || github.event_name == 'schedule' && github.event.schedule != '17 5 * * *' && 'devam' || 'full' }}
          INGEST_OK: ${{ steps.ingest.outputs.code }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      # Zincir: GitHub zamanlayıcısı tetiklerin çoğunu geciktiriyor ya da atlıyor; bu yüzden her çalıştırma bitince bir sonraki
      # devam çalıştırmasını kendisi başlatır (günde ~15-20 çalıştırma). Zamanlayıcı yalnızca yedek. 15 dakikadan kısa süren
      # çalıştırma (erken hata) 15 dakika dolana kadar bekleyip zinciri sürdürür (saatte en fazla 4 çalıştırma); son 3 çalıştırma
      # da başarısızsa zincir durur, zamanlanmış çalıştırmalar devam ettirir.
      # Durdurmak için: depo ayarlarında Actions değişkeni CHAIN_RUNS=off.
      - name: Sonraki çalıştırmayı başlat (zincir)
        if: always() && vars.CHAIN_RUNS != 'off' && !github.event.repository.private && (github.event_name == 'schedule' || contains(fromJSON('["devam","full","verify","buyut"]'), inputs.mode))
        run: |
          elapsed=$(( $(date +%s) - START_TS ))
          if [ "$elapsed" -lt 900 ]; then
            fails=$(gh run list --workflow daily-ingest.yml --status completed --limit 8 --json conclusion \
              --jq '[.[] | select(.conclusion != "cancelled")][:3] | map(select(.conclusion == "failure")) | length')
            if [ "${fails:-0}" -ge 3 ]; then echo "Son 3 çalıştırma başarısız: zincir durdu (zamanlanmış çalıştırmalar sürdürür)"; exit 0; fi
            echo "Çalıştırma $((elapsed / 60)) dakika sürdü: $(( (900 - elapsed) / 60 )) dakika beklenip zincir sürecek"
            sleep $((900 - elapsed))
          fi
          gh workflow run daily-ingest.yml -f mode=devam && echo "Sonraki devam çalıştırması sıraya alındı"
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
      - name: Sonuç
        run: exit ${{ steps.ingest.outputs.code || 1 }}
